services:
  jenkins:
    build: .
    image: pet-jenkins:latest
    container_name: pet-jenkins
    env_file:
    - .env
    ports:
    - "8080:8080"
    - "50000:50000"
    volumes:
    - jenkins_home:/var/jenkins_home
    - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml
    
volumes:
  jenkins_home:
    name: "pet-jenkins_home"
    labels:
      description: Jenkins build history and workspaces