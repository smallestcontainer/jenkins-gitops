services:
  jenkins:
    build: jenkins/
    container_name: pet-jenkins
    env_file:
    - .env
    - ./jenkins/secrets/.env-admin
    ports:
    - "8080:8080"
    - "50000:50000"
    volumes:
    - jenkins_home:/var/jenkins_home
    - ./jenkins/jenkins.yaml:/var/jenkins_home/jenkins.yaml
    - /var/run/docker.sock:/var/run/docker.sock
    secrets:
    - github-app-key.pem
    group_add:
    - "989"
    networks:
      - net-cli
    
  smee:
    image: deltaprojects/smee-client:latest
    container_name: smee-client
    environment:
    - SMEE_TOKEN=${SMEE_TOKEN}
    - JENKINS_URL=${JENKINS_URL}
    depends_on:
      - jenkins
    networks:
    - net-cli
    command: smee-client -u https://smee.io/${SMEE_TOKEN} -t ${JENKINS_URL}/github-webhook/

volumes:
  jenkins_home:
    name: "pet-jenkins_home"
    labels:
      description: Jenkins build history and workspaces
  
networks:
  net-cli:
    driver: bridge

secrets:
  github-app-key.pem:
    file: './jenkins/secrets/github-app-key.pem'